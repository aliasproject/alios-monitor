name: Test

# Assumes aliasproject/servermetrics is public -- if it's still private when
# this runs, `go build`/`go vet` will fail fetching that module.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - run: go vet ./...
      - run: go build ./...
